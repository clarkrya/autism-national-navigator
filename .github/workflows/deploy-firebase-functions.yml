
name: Deploy Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Autivoya development branch
        uses: actions/checkout@v4
        with:
          ref: journey-recovery

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/679493052595/locations/global/workloadIdentityPools/autivoya-github-pool/providers/github-actions
          service_account: autivoya-github-deploy@autism-journey-navigator.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify deployment configuration
        run: |
          test -f firebase.json
          test -f functions/package.json
          test -f functions/index.js

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project autism-journey-navigator --non-interactive
